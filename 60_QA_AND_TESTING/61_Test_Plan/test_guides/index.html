<title>Arcana Test Guides</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* layout: subproject tabs on top, one reading column of test cards grouped by ticket and session, a sticky progress bar */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --fg: #1c2230; --muted: #5b6475; --line: #dde1e8;
  --accent: #bd4f2b; --accent-soft: #fbe9e3;
  --pass: #1f7a4d; --pass-soft: #e3f3ea; --fail: #b42318; --fail-soft: #fdecea; --skip: #6b7280; --skip-soft: #eef0f3;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151c; --surface: #1a1f29; --fg: #e6e9ef; --muted: #9aa3b4; --line: #2b3240;
  --accent: #f39a78; --accent-soft: #3a2420;
  --pass: #5fd09a; --pass-soft: #163327; --fail: #ff8a80; --fail-soft: #3a1c1c; --skip: #a3abb8; --skip-soft: #252b36; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1a1f29; --fg: #e6e9ef; --muted: #9aa3b4; --line: #2b3240;
  --accent: #f39a78; --accent-soft: #3a2420;
  --pass: #5fd09a; --pass-soft: #163327; --fail: #ff8a80; --fail-soft: #3a1c1c; --skip: #a3abb8; --skip-soft: #252b36; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--body); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; }
h1 { font: 700 30px/1.15 var(--display); margin: 0 0 4px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 16px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs button { font: 600 15px var(--display); letter-spacing: .02em; padding: 8px 14px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted); cursor: pointer; display: flex; gap: 8px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs .left { font: 500 12px var(--mono); background: var(--skip-soft); color: var(--muted); padding: 1px 6px; border-radius: 10px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.count { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; display: flex; gap: 12px; flex-wrap: wrap; }
.count .p { color: var(--pass); } .count .f { color: var(--fail); } .count .s { color: var(--skip); }
.track { flex: 1 1 180px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; }
.track i { display: block; height: 100%; }
.bar label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.notice { margin: 12px 0 0; padding: 10px 12px; border-radius: 6px; background: var(--accent-soft); font-size: 14px; }
.ticket { margin-top: 28px; }
.ticket > h2 { font: 700 22px/1.2 var(--display); margin: 0 0 6px; }
.ticket > h2 .tk { font: 500 13px var(--mono); color: var(--accent); margin-right: 8px; }
.before { margin: 8px 0 8px; padding-left: 18px; color: var(--muted); }
.before li { margin: 4px 0; }
h3 { font: 700 18px/1.2 var(--display); margin: 28px 0 4px; letter-spacing: .01em; }
.setup { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
.tests { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; border-left: 4px solid var(--line); min-width: 0; }
.card.pass { border-left-color: var(--pass); } .card.fail { border-left-color: var(--fail); } .card.skip { border-left-color: var(--skip); }
.head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.id { font: 500 12px var(--mono); color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 4px; }
.title { font-weight: 600; flex: 1 1 240px; min-width: 0; }
.rule { font: 500 12px var(--mono); color: var(--muted); }
.observe { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.observe.pc { color: var(--accent); }
dl { margin: 10px 0 0; display: grid; grid-template-columns: 82px 1fr; gap: 4px 12px; font-size: 14px; }
dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }
dd { margin: 0; min-width: 0; }
@media (max-width: 480px) { dl { grid-template-columns: 1fr; } dt { padding-top: 6px; } }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.actions button { font: 500 13px var(--body); padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions button[aria-pressed="true"][data-s="pass"] { background: var(--pass-soft); border-color: var(--pass); color: var(--pass); }
.actions button[aria-pressed="true"][data-s="fail"] { background: var(--fail-soft); border-color: var(--fail); color: var(--fail); }
.actions button[aria-pressed="true"][data-s="skip"] { background: var(--skip-soft); border-color: var(--skip); color: var(--skip); }
.actions button:disabled { opacity: .5; cursor: default; }
textarea { width: 100%; box-sizing: border-box; margin-top: 10px; min-height: 52px; font: 14px/1.4 var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; resize: vertical; }
.saved { font-size: 12px; color: var(--muted); margin-top: 4px; min-height: 1em; }
.empty { color: var(--muted); margin-top: 24px; }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } }
</style>

<div class="wrap">
  <h1>Arcana Test Guides</h1>
  <p class="sub">Every pending in-game test, one tab per subproject, level by level. Mark each test and write what you saw.</p>
  <div class="tabs" id="tabs" role="tablist" aria-label="Subprojects"></div>
  <div class="bar">
    <div class="count" id="count"><span>loading the tests…</span></div>
    <div class="track" id="track" aria-hidden="true"></div>
    <label><input type="checkbox" id="todo"> Only tests left</label>
  </div>
  <p class="notice" id="notice" hidden></p>
  <div id="panel" role="tabpanel"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const state = {};                 // results by key "<ticket>_<test id>"
let tabs = [], active = null, db = null, canWrite = false;

const key = (g, t) => `${g.ticket}_${t.id}`;
const testsOf = tab => tab.guides.flatMap(g => g.sessions.flatMap(s => s.tests.map(t => key(g, t))));
function tally(keys) { const c = { pass: 0, fail: 0, skip: 0 }; keys.forEach(k => { const st = (state[k] || {}).status; if (c[st] !== undefined) c[st]++; }); c.left = keys.length - c.pass - c.fail - c.skip; return c; }

function counts() {
  if (!active) return;
  const keys = testsOf(active), c = tally(keys), n = keys.length || 1;
  $('#count').innerHTML = `<span class="p">${c.pass} pass</span><span class="f">${c.fail} fail</span><span class="s">${c.skip} skipped</span><span>${c.left} left</span>`;
  $('#track').innerHTML = ['pass', 'fail', 'skip'].map(k => `<i style="width:${100 * c[k] / n}%;background:var(--${k})"></i>`).join('');
  tabs.forEach(t => { const b = document.getElementById('tab-' + t.name); if (b) b.querySelector('.left').textContent = tally(testsOf(t)).left; });
}

function paint(k) {
  const card = document.getElementById('t-' + k); if (!card) return;
  const r = state[k] || {};
  card.className = 'card' + (r.status ? ' ' + r.status : '');
  card.querySelectorAll('button[data-s]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.s === r.status)));
  const ta = card.querySelector('textarea');
  if (document.activeElement !== ta) ta.value = r.notes || '';
  card.hidden = $('#todo').checked && !!r.status;
}

async function save(k, patch, msg) {
  if (!db || !canWrite) return;
  const next = { ...(state[k] || {}), ...patch, at: new Date().toISOString() };
  state[k] = next; paint(k); counts();
  const out = document.querySelector(`#t-${CSS.escape(k)} .saved`);
  try { await db.collection('results').doc(k).set(next); out.textContent = msg; }
  catch (e) { out.textContent = 'Not saved: ' + (e && e.message ? e.message : 'try again'); }
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function card(g, t) {
  const k = key(g, t), c = el('article', 'card'); c.id = 't-' + k;
  const head = el('div', 'head');
  head.append(el('span', 'id', t.id), el('span', 'title', t.title), el('span', 'rule', t.rule));
  if (t.kind === 'observe') head.append(el('span', 'observe', 'observe'));
  if (t.edition === 'PC') head.append(el('span', 'observe pc', 'PC edition'));
  const dl = el('dl');
  [['Steps', t.steps], ['Expected', t.expected], ['Fails if', t.fails], ['Plan B', t.planb]].forEach(([n, v]) => { if (v) dl.append(el('dt', null, n), el('dd', null, v)); });
  const actions = el('div', 'actions');
  [['pass', 'Pass'], ['fail', 'Fail'], ['skip', 'Skip']].forEach(([s, label]) => {
    const b = el('button', null, label); b.type = 'button'; b.dataset.s = s; b.setAttribute('aria-pressed', 'false'); b.disabled = !canWrite;
    b.addEventListener('click', () => save(k, { status: (state[k] || {}).status === s ? null : s }, 'Saved'));
    actions.append(b);
  });
  const ta = el('textarea'); ta.id = 'n-' + k; ta.placeholder = 'What you saw (numbers from the combat log help)'; ta.disabled = !canWrite;
  ta.setAttribute('aria-label', 'Notes for ' + t.id);
  ta.addEventListener('change', () => save(k, { notes: ta.value }, 'Notes saved'));
  c.append(head, dl, actions, ta, el('div', 'saved'));
  return c;
}

function show(name) {
  active = tabs.find(t => t.name === name) || tabs[0]; if (!active) return;
  tabs.forEach(t => { const b = document.getElementById('tab-' + t.name); b.setAttribute('aria-selected', String(t === active)); b.tabIndex = t === active ? 0 : -1; });
  try { localStorage.setItem('arcana-tab', active.name); } catch {}
  const panel = $('#panel'); panel.replaceChildren(); panel.setAttribute('aria-labelledby', 'tab-' + active.name);
  for (const g of active.guides) {
    const sec = el('section', 'ticket'), h = el('h2');
    h.append(el('span', 'tk', g.ticket), document.createTextNode(g.title));
    const before = el('ul', 'before'); before.replaceChildren(...g.before.map(b => el('li', null, b)));
    sec.append(h, before);
    for (const s of g.sessions) {
      const list = el('div', 'tests'); s.tests.forEach(t => list.append(card(g, t)));
      sec.append(el('h3', null, s.name), el('p', 'setup', 'Setup: ' + s.setup), list);
    }
    panel.append(sec);
  }
  if (!active.guides.length) panel.append(el('p', 'empty', 'No pending tests here.'));
  testsOf(active).forEach(paint); counts();
}

function renderTabs() {
  const bar = $('#tabs'); bar.replaceChildren();
  tabs.forEach(t => {
    const b = el('button'); b.type = 'button'; b.id = 'tab-' + t.name; b.setAttribute('role', 'tab');
    b.append(document.createTextNode(t.name), el('span', 'left', '–'));
    b.addEventListener('click', () => { history.replaceState(null, '', '#' + t.name); show(t.name); });
    bar.append(b);
  });
  bar.addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const i = tabs.indexOf(active), j = (i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length;
    show(tabs[j].name); document.getElementById('tab-' + tabs[j].name).focus();
  });
}

$('#todo').addEventListener('change', () => active && testsOf(active).forEach(paint));

(async () => {
  try {
    const m = await (await fetch('TEST_GUIDES.json')).json();
    tabs = await Promise.all(m.tabs.map(async t => ({ name: t.name, guides: await Promise.all(t.guides.map(async p => (await fetch(p)).json())) })));
  } catch { $('#count').textContent = 'The test lists could not be loaded.'; return; }
  db = (await window.claude?.use?.('db')) ?? null; canWrite = !!db;
  if (!db) { $('#notice').hidden = false; $('#notice').textContent = 'Results can\'t be saved in this view (sign in to claude.ai). You can still read the tests.'; }
  renderTabs();
  let first = location.hash.slice(1);
  if (!first) { try { first = localStorage.getItem('arcana-tab') || ''; } catch {} }
  show(first);
  if (db) db.collection('results').onSnapshot(snap => {
    snap.docs.forEach(d => { state[d.id] = d.data() || {}; paint(d.id); });
    counts();
  }, () => { $('#notice').hidden = false; $('#notice').textContent = 'Saved results could not be loaded right now.'; });
})();
</script>
